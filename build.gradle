// Real instrument reference and quotes for the trading estate: fetches a symbol's mark from an
// external provider and serves the last-good snapshot, so a consumer (the live order book) can
// anchor its book to a real price instead of a synthetic seed. A library, depended on via
// JitPack — no service, no box of its own.
plugins {
    id 'com.damianhoward.kotlin-conventions' version '0.5.0'
    id 'application'
    id 'maven-publish'
}

group = 'io.github.damian1000'
version = '1.1.8'

application {
    applicationName = 'market-data'
    mainClass = 'io.github.damian1000.marketdata.MainKt'
}

// The build publishes itself rather than leaving JitPack to inject its own invocation. That
// injection is what blocked adding the bounded distribution-download retry the other JitPack
// builds carry: an explicit `install:` in jitpack.yml replaces the generated command, and
// without a publication of our own there would be nothing left to publish. No remote
// repository — JitPack builds from the git tag and serves the result under
// com.github.damianhoward:market-data:<tag>; publishing exists for publishToMavenLocal.
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

dependencies {
    implementation deps.gson
    implementation deps.slf4j.api
    runtimeOnly deps.slf4j.simple
}

// Only the process entry point (MainKt — main() fetches a live quote and prints it) is excluded.
// The provider client, JSON parsing, cache, and domain are all exercised by tests and counted.
coverageExcludes = ['**/marketdata/MainKt.class']